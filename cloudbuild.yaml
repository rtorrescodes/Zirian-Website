steps:
  # Step 1: Build Docker image using Secret Manager for Google Maps API Key
  - name: 'gcr.io/cloud-builders/docker'
    id: Build
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=$$MAPS_KEY \
          -t gcr.io/$PROJECT_ID/zirianweb:$COMMIT_SHA \
          -t gcr.io/$PROJECT_ID/zirianweb:latest \
          . -f Dockerfile
    secretEnv: ['MAPS_KEY']

  # Step 2: Push Docker image to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: Push
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/zirianweb:$COMMIT_SHA'

  # Step 3: Deploy to Cloud Run service zirianweb in us-central1
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: Deploy
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy zirianweb \
          --image=gcr.io/$PROJECT_ID/zirianweb:$COMMIT_SHA \
          --region=us-central1 \
          --platform=managed \
          --set-env-vars=NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=$$MAPS_KEY \
          --quiet
    secretEnv: ['MAPS_KEY']

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/GOOGLE_MAPS_API_KEY/versions/latest
      env: 'MAPS_KEY'

images:
  - 'gcr.io/$PROJECT_ID/zirianweb:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/zirianweb:latest'

options:
  logging: CLOUD_LOGGING_ONLY
